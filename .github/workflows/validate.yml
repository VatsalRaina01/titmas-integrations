name: validate-agent-integrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        surface: [sdk/python, langchain, openai-agents]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install SDK
        run: python -m pip install -e "./sdk/python[dev]"
      - name: Install adapter
        if: matrix.surface != 'sdk/python'
        run: python -m pip install -e "./${{ matrix.surface }}[dev]"
      - name: Test
        working-directory: ${{ matrix.surface }}
        run: |
          python -m pytest
          python -m ruff check .
      - name: Type-check Python SDK
        if: matrix.surface == 'sdk/python'
        working-directory: sdk/python
        run: python -m mypy src

  python-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install all Python surfaces
        run: |
          python -m pip install -e "./sdk/python[dev]"
          python -m pip install -e "./langchain[dev]" -e "./openai-agents[dev]"
      - name: Run aggregate tests and lint
        run: |
          python -m pytest sdk/python langchain openai-agents
          python -m ruff check sdk/python langchain openai-agents

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        surface: [sdk/typescript, mcp]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.surface }}/package-lock.json
      - name: Build TypeScript SDK first
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
      - name: Install and build surface
        if: matrix.surface == 'mcp'
        working-directory: mcp
        run: |
          npm ci
          npm run build

  machine-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate machine-readable JSON
        run: |
          jq -e '.primary_customer == "AI_AGENT"' agent-entry.json
          jq -e '.result_semantics.preserves_not_assessed == true' integration-manifest.json
          jq -e '.result_semantics.truth_verified == false' integration-manifest.json
          jq -e '.reported_version_equals_retained_release == false' openapi/source-manifest.json
          node scripts/verify-openapi-snapshot.mjs
          node --test tests/*.test.mjs
