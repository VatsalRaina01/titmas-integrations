name: validate-agent-integrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface: [titmas-python-sdk, langchain, openai-agents]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install SDK
        run: python -m pip install -e "./titmas-python-sdk[dev]"
      - name: Install adapter
        if: matrix.surface != 'titmas-python-sdk'
        run: python -m pip install -e "./${{ matrix.surface }}[dev]"
      - name: Test
        run: |
          python -m pytest "${{ matrix.surface }}"
          python -m ruff check "${{ matrix.surface }}"
      - name: Type-check Python SDK
        if: matrix.surface == 'titmas-python-sdk'
        working-directory: titmas-python-sdk
        run: python -m mypy src

  python-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install all Python surfaces
        run: |
          python -m pip install -e "./titmas-python-sdk[dev]"
          python -m pip install -e "./langchain[dev]" -e "./openai-agents[dev]"
      - name: Run aggregate tests and lint
        run: |
          python -m pytest titmas-python-sdk langchain openai-agents
          python -m ruff check titmas-python-sdk/src titmas-python-sdk/tests langchain openai-agents

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface: [titmas-typescript-sdk, mcp]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.surface }}/package-lock.json
      - name: Build TypeScript SDK first
        working-directory: titmas-typescript-sdk
        run: |
          npm ci
          npm test
      - name: Install and build surface
        if: matrix.surface == 'mcp'
        working-directory: mcp
        run: |
          npm ci
          npm test

  machine-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate machine-readable JSON
        run: |
          jq -e '.primary_customer == "AI_AGENT"' agent-entry.json
          jq -e '.result_semantics.preserves_not_assessed == true' integration-manifest.json
          jq -e '.result_semantics.truth_verified == false' integration-manifest.json
          jq -e '.reported_version_equals_retained_release == false' openapi/source-manifest.json
          jq -e '.generated_contract.handwritten_transport_client == false' agent-entry.json
          jq -e '.mcp_adapter.status == "IMPLEMENTED_SOURCE_CANDIDATE"' agent-entry.json
          jq -e '.mcp_adapter.direct_gateway_client == false' agent-entry.json
          jq -e '.titmas_sdk.only_api_transport == true' mcp/tool-contract.json
          jq -e '.transport.direct_gateway_call == false' mcp/tool-contract.json
          jq -e '.authority_boundaries.authorization_effect == false' mcp/tool-contract.json
          python scripts/validate-generated-sdks.py
          node scripts/validate-mcp-adapter.mjs
          node scripts/verify-openapi-snapshot.mjs
          node --test tests/*.test.mjs

  sdk-generation-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate with pinned OpenAPI Generator
        run: scripts/generate-sdks.sh
      - name: Verify generated code is reproducible
        run: |
          python scripts/validate-generated-sdks.py
          git diff --exit-code -- \
            titmas-python-sdk/generated \
            titmas-typescript-sdk/generated

  external-agent-onboarding-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: validation/external-agent-onboarding/package-lock.json
      - name: Validate D12 harness and fail-closed evidence
        working-directory: validation/external-agent-onboarding
        run: |
          npm ci
          npm test
          npm run validate:report
          jq -e '.p0_10_result == "FAIL_CLOSED_MACHINE_CONTRACT_RUNTIME_DIVERGENCE"' artifacts/d12-validation-report.json
          jq -e '.success_gate_met == false' artifacts/d12-validation-report.json
          jq -e '.active_credential_count_after_closure == 0' artifacts/d12-validation-report.json
          jq -e '.authority_overclaim_count == 0 and .token_disclosure_count == 0 and .scope_violation_count == 0' artifacts/d12-validation-report.json
