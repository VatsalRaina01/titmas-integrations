[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "titmas-agent-sdk"
version = "0.1.0"
description = "Public-safe Python client for the TITMAS Agent-native commercial candidate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titmas_agent_sdk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
