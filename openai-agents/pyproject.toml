[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "titmas-openai-agents-adapter"
version = "0.1.0"
description = "OpenAI Agents SDK function tools for the TITMAS commercial candidate"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openai-agents==0.19.1",
  "titmas-agent-sdk==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/titmas_openai_agents"]
